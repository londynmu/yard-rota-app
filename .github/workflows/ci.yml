name: CI

on:
  pull_request:
  push:
    branches: [flutter]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:run
      # Same public anon values as netlify.toml [build.environment] (Vite needs VITE_* at build).
      - name: Build
        env:
          VITE_SUPABASE_URL: https://jkjvtvwedjiupxoibpld.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpranZ0dndlZGppdXB4b2licGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU0NDI0MDMsImV4cCI6MjA2MTAxODQwM30.J15XgpiHz-oKSghqctJ8Bll0BXdbKO_rexeav1lj8Gw
          VITE_SITE_URL: https://shunters.net
        run: npm run build

  flutter:
    name: Flutter (analyze, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/yard_rota_flutter
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  edge-functions:
    name: Edge functions (deno check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check edge functions
        run: |
          # Shared gate + interactive functions (no npm:googleapis).
          # Gmail importer uses npm:googleapis — validated via deploy smoke, not CI.
          deno check supabase/functions/_shared/requireAdminOrCron.ts
          deno check supabase/functions/import-performance-csv/index.ts
          deno check supabase/functions/send-rota-email/index.ts
