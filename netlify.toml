[build]
command = "npm run build"
publish = "dist"

# Vite inlines only VITE_* at build time. Without these, production shows the
# amber "App configuration warning" and falls back to hardcoded client values.
# Anon key is a public client key (already shipped in the browser bundle).
# Prefer Site env in Netlify UI for rotation; keep these as the deploy source of truth
# until Site env is confirmed. Do not put service_role here.
[build.environment]
  VITE_SUPABASE_URL = "https://jkjvtvwedjiupxoibpld.supabase.co"
  VITE_SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpranZ0dndlZGppdXB4b2licGxkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDU0NDI0MDMsImV4cCI6MjA2MTAxODQwM30.J15XgpiHz-oKSghqctJ8Bll0BXdbKO_rexeav1lj8Gw"
  VITE_SITE_URL = "https://shunters.net"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Vite hashed assets - safe to cache forever (hash changes on content change)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker - always check for updates
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA registration script - always revalidate
[[headers]]
  for = "/registerSW.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# PWA manifest - always revalidate
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Version check file - always revalidate
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML entry point - always check for latest version
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# SPA routes (e.g. /profile, /precheck) – serve index.html with no-cache so browser gets fresh HTML
# More specific paths (/assets/*, /service-worker.js, etc.) are defined above and take precedence
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"